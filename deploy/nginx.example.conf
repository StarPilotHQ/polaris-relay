# nginx terminates HTTPS and proxies to the relay on the same host.
# Relay environment: ALLOWED_HOSTS=relay.example.com  ALLOWED_ORIGINS=https://relay.example.com
server {
  listen 443 ssl;
  http2 on;
  server_name relay.example.com;
  ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    # Optional: nginx's own sign-in instead of the relay's (then INSECURE_ALLOW_NO_AUTH=1 on the relay).
    # auth_basic "Polaris Relay";
    # auth_basic_user_file /etc/nginx/relay.htpasswd;
  }
}
